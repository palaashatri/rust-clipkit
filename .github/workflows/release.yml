name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag (e.g. v1.0.0)'
        required: true
        default: 'v1.0.0'

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  build:
    name: Build — ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: ClipKit-windows-x64.zip

          - name: Windows ARM64
            os: windows-latest
            target: aarch64-pc-windows-msvc
            artifact: ClipKit-windows-arm64.zip

          - name: macOS Apple Silicon
            os: macos-latest
            target: aarch64-apple-darwin
            artifact: ClipKit-macos-aarch64

          - name: macOS Intel
            os: macos-latest
            target: x86_64-apple-darwin
            artifact: ClipKit-macos-x64

          - name: Linux x86_64
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            artifact: ClipKit-linux-x64

          - name: Linux ARM64
            os: ubuntu-22.04
            target: aarch64-unknown-linux-gnu
            artifact: ClipKit-linux-arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux system libraries
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libxkbcommon-dev \
            libwayland-dev \
            wayland-protocols \
            libx11-dev \
            libxcb1-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libxcb-render0-dev \
            libvulkan-dev \
            libgles2-mesa-dev \
            libglib2.0-dev \
            libgtk-3-dev \
            mesa-vulkan-drivers \
            librsvg2-bin

      - name: Install Linux ARM64 Cross-Compiler
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo dpkg --add-architecture arm64
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu \
            libxkbcommon-dev:arm64 \
            libwayland-dev:arm64 \
            libx11-dev:arm64 \
            libxcb1-dev:arm64 \
            libxcb-shape0-dev:arm64 \
            libxcb-xfixes0-dev:arm64 \
            libxcb-render0-dev:arm64 \
            libvulkan-dev:arm64 \
            libgles2-mesa-dev:arm64
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> $GITHUB_ENV
          echo "CC_aarch64_unknown_linux_gnu=aarch64-linux-gnu-gcc" >> $GITHUB_ENV
          echo "CXX_aarch64_unknown_linux_gnu=aarch64-linux-gnu-g++" >> $GITHUB_ENV
          echo "PKG_CONFIG_ALLOW_CROSS=1" >> $GITHUB_ENV
          echo "PKG_CONFIG_PATH=/usr/lib/aarch64-linux-gnu/pkgconfig" >> $GITHUB_ENV

      - name: Install macOS dependencies
        if: startsWith(matrix.os, 'macos')
        run: brew install librsvg

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build and Bundle (Windows)
        if: matrix.os == 'windows-latest'
        shell: cmd
        run: |
          call scripts\bundle_windows.bat ${{ matrix.target }}
          powershell Compress-Archive -Path dist\ClipKit.exe -DestinationPath ${{ matrix.artifact }}

      - name: Build and Bundle (macOS)
        if: startsWith(matrix.os, 'macos')
        run: |
          chmod +x scripts/bundle_macos.sh
          ./scripts/bundle_macos.sh ${{ matrix.target }}
          zip -r "${{ matrix.artifact }}.zip" "ClipKit.app"

      - name: Build and Bundle (Linux)
        if: matrix.os == 'ubuntu-22.04'
        run: |
          # Install appimagetool
          wget https://github.com/AppImage/AppImageKit/releases/download/13/appimagetool-x86_64.AppImage
          chmod +x appimagetool-x86_64.AppImage
          # Extract because FUSE doesn't work in GHA
          ./appimagetool-x86_64.AppImage --appimage-extract
          export APPIMAGE_TOOL="$(pwd)/squashfs-root/AppRun"
          
          chmod +x scripts/bundle_linux.sh
          ./scripts/bundle_linux.sh ${{ matrix.target }}

      - name: Upload artifact (Windows)
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}

      - name: Upload artifact (macOS)
        if: startsWith(matrix.os, 'macos')
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}.zip

      - name: Upload artifact (Linux)
        if: matrix.os == 'ubuntu-22.04'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            dist/ClipKit-linux-*
            dist/ClipKit-*.AppImage

  release:
    name: Publish Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Determine release tag
        id: tag
        env:
          TAG_INPUT: ${{ github.event.inputs.tag_name }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            echo "name=$TAG_INPUT" >> "$GITHUB_OUTPUT"
          else
            echo "name=$REF_NAME" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          name: ClipKit ${{ steps.tag.outputs.name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: artifacts/*
