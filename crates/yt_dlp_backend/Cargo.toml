[package]
name = "yt_dlp_backend"
version = "1.0.0"
edition = "2021"

[dependencies]
ytdlp-core = { path = "../core" }
tokio = { version = "1", features = ["rt", "process", "fs", "io-util", "sync"] }
reqwest = { version = "0.11", default-features = false, features = ["json", "stream", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
regex = "1"
futures = "0.3"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
sha2 = "0.10"
